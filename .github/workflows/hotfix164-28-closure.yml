name: HOTFIX164.28 Request-Bound Bridge Closure Candidate

on:
  push:
    tags:
      - 'HOTFIX164.28*'
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: hotfix164-28-closure-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regression-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Enforce frozen release identity and candidate manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import main, providers
          expected = 'V22.1-HOTFIX123.2-SINGLE-REQUEST-DETERMINISM-LIVE-CASCADE'
          if Path('VERSION.txt').read_text(encoding='utf-8').strip() != expected or providers.VERSION != expected:
              raise SystemExit('HOTFIX164.28_VERSION_CONTRACT_FAILED')
          manifest = json.loads(Path('HOTFIX164.28_RELEASE_MANIFEST.json').read_text(encoding='utf-8'))
          if manifest.get('release') != 'HOTFIX164.28' or manifest.get('provider_core_identity') != expected:
              raise SystemExit('HOTFIX164.28_RELEASE_MANIFEST_FAILED')
          if main.DISPLAY_VERSION != providers.CURRENT_HOTFIX_RELEASE_VERSION:
              raise SystemExit('HOTFIX164.28_RUNTIME_LABEL_FAILED')
          if not providers.CURRENT_HOTFIX_RELEASE_VERSION.startswith('HOTFIX164.28 '):
              raise SystemExit('HOTFIX164.28_RUNTIME_LABEL_FAILED')
          contract = manifest.get('bridge_closure_contract', {})
          if contract.get('live_final_closure_proven') is not False:
              raise SystemExit('HOTFIX164.28_LIVE_CLOSURE_OVERCLAIM_FAILED')
          print('VERSION_CONTRACT=PASS')
          print('HOTFIX164.28_RUNTIME_LABEL=PASS')
          print('LIVE_FINAL_CLOSURE=NOT_PROVEN_UNTIL_DEPLOYED_RUN_A_B')
          PY
      - name: Run full regression explicitly
        run: pytest -q
      - name: Compile, repeat regression in isolation, production core gate, ZIP round-trip
        run: python build_release.py --output HOTFIX164.28_RUNTIME_BRIDGE_FINAL_CLOSURE.zip
      - name: Upload candidate artifacts (not a live API proof)
        if: ${{ success() && hashFiles('HOTFIX164.28_RUNTIME_BRIDGE_FINAL_CLOSURE.zip') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: HOTFIX164.28-runtime-bridge-final-closure-candidate
          path: |
            HOTFIX164.28_RUNTIME_BRIDGE_FINAL_CLOSURE.zip
            HOTFIX164.28_RUNTIME_BRIDGE_FINAL_CLOSURE.zip.sha256
            HOTFIX164.28_RELEASE_MANIFEST.json
            HOTFIX164.28_FINAL_CLOSURE_STATUS.md
            HOTFIX164.28_RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 14
