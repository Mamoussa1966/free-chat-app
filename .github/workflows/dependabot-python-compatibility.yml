
name: Dependabot Python Compatibility

on:
  pull_request:
    branches:
      - gitops-v0.4-final
    paths:
      - "requirements.txt"
      - "*.py"
      - "**/*.py"
      - "tests/**"
      - ".github/workflows/dependabot-python-compatibility.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependabot-python-compatibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'dependabot/pip/')
    name: Regression / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run production-core and regression tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys

          env = os.environ.copy()
          markers = (
              "API_KEY",
              "TOKEN",
              "SECRET",
              "PASSWORD",
              "CREDENTIAL",
              "AUTH",
          )
          for key in list(env):
              if any(marker in key.upper() for marker in markers):
                  env.pop(key, None)

          env["PYTHONDONTWRITEBYTECODE"] = "1"
          env["PYTEST_DISABLE_PLUGIN_AUTOLOAD"] = "1"

          command = (
              "import build_release; "
              "build_release.run_production_core_harness(); "
              "build_release.run_tests()"
          )
          subprocess.run(
              [sys.executable, "-c", command],
              check=True,
              env=env,
          )
          PY
