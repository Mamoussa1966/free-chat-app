name: Generate terminal lifecycle migration

on:
  push:
    branches:
      - quality/persistence-round-mobile-acceptance-20261110
    paths:
      - "supabase/patches/guard_terminal_lifecycle_monotonicity.sql"
      - ".github/workflows/generate-terminal-lifecycle-migration.yml"

permissions:
  contents: read

jobs:
  generate:
    name: Generate a timestamped migration with Supabase CLI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pinned Supabase CLI v2
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3
        with:
          version: 2.122.0

      - name: Generate migration filename and populate it from reviewed SQL
        shell: bash
        run: |
          set -euo pipefail
          supabase migration new enforce_terminal_request_round_lifecycle
          python - <<'PY'
          from pathlib import Path
          import hashlib

          suffix = "_enforce_terminal_request_round_lifecycle.sql"
          candidates = sorted(Path("supabase/migrations").glob(f"*{suffix}"))
          if not candidates:
              raise SystemExit("SUPABASE_MIGRATION_GENERATION=FAIL; CLI did not create the expected migration")
          target = candidates[-1]
          template = Path("supabase/patches/guard_terminal_lifecycle_monotonicity.sql")
          target.write_text(template.read_text(encoding="utf-8"), encoding="utf-8")
          digest = hashlib.sha256(target.read_bytes()).hexdigest()
          print(f"SUPABASE_MIGRATION_GENERATION=PASS")
          print(f"generated_migration={target.as_posix()}")
          print(f"migration_sha256={digest}")
          PY

      - name: Upload the CLI-generated migration
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: terminal-lifecycle-generated-migration
          path: supabase/migrations/*_enforce_terminal_request_round_lifecycle.sql
          if-no-files-found: error
          retention-days: 7
