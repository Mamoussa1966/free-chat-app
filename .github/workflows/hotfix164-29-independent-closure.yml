name: HOTFIX164.29 Independent Live Closure Gate

on:
  workflow_dispatch:
    inputs:
      evidence_path:
        description: "Repository path to the freshly exported HOTFIX164.29_BRIDGE_EVIDENCE_FORENSICS.json"
        required: true
        default: evidence/HOTFIX164.29_BRIDGE_EVIDENCE_FORENSICS.json
        type: string

permissions:
  contents: read

concurrency:
  group: hotfix164-29-independent-closure-${{ github.ref }}
  cancel-in-progress: false

jobs:
  independent-closure:
    name: Full regression, package identity, and independent live evidence gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout selected release candidate
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Confirm frozen core and HOTFIX164.29 release contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import main, providers
          expected_core = "V22.1-HOTFIX123.2-SINGLE-REQUEST-DETERMINISM-LIVE-CASCADE"
          manifest = json.loads(Path("HOTFIX164.29_RELEASE_MANIFEST.json").read_text(encoding="utf-8"))
          assert Path("VERSION.txt").read_text(encoding="utf-8").strip() == expected_core
          assert providers.VERSION == expected_core
          assert providers.CURRENT_HOTFIX_RELEASE_VERSION.startswith("HOTFIX164.29 ")
          assert main.DISPLAY_VERSION == providers.CURRENT_HOTFIX_RELEASE_VERSION
          assert manifest.get("release") == "HOTFIX164.29"
          assert manifest.get("provider_core_identity") == expected_core
          assert manifest.get("bridge_closure_contract", {}).get("live_final_closure_proven") is False
          print("FROZEN_PROVIDER_IDENTITY=PASS")
          print("HOTFIX164.29_RELEASE_IDENTITY=PASS")
          print("LIVE_CLOSURE_NOT_PRECLAIMED=PASS")
          PY

      - name: Run full offline regression suite
        run: pytest -q

      - name: Build and verify the exact root-level release archive
        run: |
          python build_release.py --output dist/HOTFIX164.29_FULL_RELEASE_CANDIDATE.zip
          cp RELEASE_MANIFEST.json dist/RELEASE_MANIFEST.json
          sha256sum dist/HOTFIX164.29_FULL_RELEASE_CANDIDATE.zip > dist/HOTFIX164.29_FULL_RELEASE_CANDIDATE.zip.sha256
      - name: Verify live A/B evidence against the exact archive, manifest, and frozen identity
        id: live_gate
        env:
          EVIDENCE_PATH: ${{ inputs.evidence_path }}
        run: |
          test -f "$EVIDENCE_PATH"
          python HOTFIX164.29_INDEPENDENT_CLOSURE_GATE.py \
            --evidence "$EVIDENCE_PATH" \
            --manifest HOTFIX164.29_RELEASE_MANIFEST.json \
            --zip dist/HOTFIX164.29_FULL_RELEASE_CANDIDATE.zip \
            --sha256 dist/HOTFIX164.29_FULL_RELEASE_CANDIDATE.zip.sha256 \
            --output dist/HOTFIX164.29_INDEPENDENT_CLOSURE_RESULT.json \
            --verified-manifest-output dist/HOTFIX164.29_VERIFIED_RELEASE_MANIFEST.json

      - name: Upload independent diagnostics (including NOT_PROVEN on failure)
        if: ${{ always() && hashFiles('dist/HOTFIX164.29_INDEPENDENT_CLOSURE_RESULT.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: HOTFIX164.29-independent-closure-diagnostics
          path: dist/HOTFIX164.29_INDEPENDENT_CLOSURE_RESULT.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload final candidate only after independent closure PASS
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: HOTFIX164.29-final-closure-verified-candidate
          path: |
            dist/HOTFIX164.29_FULL_RELEASE_CANDIDATE.zip
            dist/HOTFIX164.29_FULL_RELEASE_CANDIDATE.zip.sha256
            dist/RELEASE_MANIFEST.json
            dist/HOTFIX164.29_INDEPENDENT_CLOSURE_RESULT.json
            dist/HOTFIX164.29_VERIFIED_RELEASE_MANIFEST.json
          if-no-files-found: error
          retention-days: 30

      - name: Assert the exact independent closure outcome
        if: ${{ success() }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("dist/HOTFIX164.29_INDEPENDENT_CLOSURE_RESULT.json").read_text(encoding="utf-8"))
          if report.get("status") != "PASS" or report.get("live_final_closure_proven") is not True:
              raise SystemExit("HOTFIX164.29_INDEPENDENT_FINAL_CLOSURE_NOT_PROVEN")
          print("HOTFIX164.29_INDEPENDENT_FINAL_CLOSURE=PASS")
          PY
