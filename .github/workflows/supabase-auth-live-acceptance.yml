name: Supabase Auth live acceptance

on:
  # Test-branch pushes run the dedicated test-project acceptance check so a
  # user need not repeat the manual dispatch after a test-only diagnostic fix.
  push:
    branches:
      - "ci/supabase-auth-live-acceptance-dispatch"
  workflow_dispatch:
    inputs:
      confirm_test_project:
        description: "Type I_CONFIRM_TEST_PROJECT only for the dedicated Supabase test project"
        required: true
        type: string
      phase:
        description: "Choose signup first; after confirming both test emails choose auth-postgrest"
        required: true
        type: choice
        options:
          - signup
          - auth-postgrest

permissions:
  contents: read

jobs:
  live-auth-postgrest-isolation:
    name: Real Auth sessions, refresh, and PostgREST RLS
    if: ${{ github.event_name == 'push' || inputs.confirm_test_project == 'I_CONFIRM_TEST_PROJECT' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_TEST_USER_A_EMAIL: ${{ secrets.SUPABASE_TEST_USER_A_EMAIL }}
      SUPABASE_TEST_USER_A_PASSWORD: ${{ secrets.SUPABASE_TEST_USER_A_PASSWORD }}
      SUPABASE_TEST_USER_B_EMAIL: ${{ secrets.SUPABASE_TEST_USER_B_EMAIL }}
      SUPABASE_TEST_USER_B_PASSWORD: ${{ secrets.SUPABASE_TEST_USER_B_PASSWORD }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate required secrets and exact test-project key fingerprint
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import os

          names = (
              "SUPABASE_URL",
              "SUPABASE_PUBLISHABLE_KEY",
              "SUPABASE_TEST_USER_A_EMAIL",
              "SUPABASE_TEST_USER_A_PASSWORD",
              "SUPABASE_TEST_USER_B_EMAIL",
              "SUPABASE_TEST_USER_B_PASSWORD",
          )
          missing = [name for name in names if not os.environ.get(name, "").strip()]
          if missing:
              print("LIVE_AUTH_ACCEPTANCE=BLOCKED; missing GitHub Actions repository secrets: " + ", ".join(missing))
              raise SystemExit(2)

          # Safety gate: this workflow is for the dedicated test project only.
          expected_url = "https://pidcepvwsezdrlhxqksg.supabase.co"
          actual_url = os.environ.get("SUPABASE_URL", "").strip().rstrip("/")
          if actual_url != expected_url:
              print("LIVE_AUTH_ACCEPTANCE=BLOCKED; SUPABASE_URL does not match the dedicated test project")
              raise SystemExit(2)

          # Compare a SHA-256 fingerprint with the active publishable key
          # returned by the dedicated Supabase test project. Never print the key.
          expected_key_sha256 = "4466db377d54ad52d16b78002fa97e0cadfff82cd3691b143ecd93ffb0377b32"
          actual_key = os.environ.get("SUPABASE_PUBLISHABLE_KEY", "")
          actual_key_sha256 = hashlib.sha256(actual_key.encode("utf-8")).hexdigest()
          if actual_key_sha256 != expected_key_sha256:
              print("LIVE_AUTH_PUBLISHABLE_KEY_MATCH=FAIL; GitHub Secret does not match the active test-project publishable key")
              raise SystemExit(2)

          print("LIVE_AUTH_ACCEPTANCE_CONFIG=PASS")
          print("LIVE_AUTH_ACCEPTANCE_TARGET=PASS (dedicated test project)")
          print("LIVE_AUTH_PUBLISHABLE_KEY_MATCH=PASS")

      - name: Install minimal HTTP dependency
        run: python -m pip install "requests>=2.31,<3"

      - name: Diagnose credential-secret metadata without revealing values
        shell: bash
        run: |
          python - <<'PY'
          import os

          def mask_email(value):
              value = value.strip()
              if "@" not in value:
                  return "<invalid-email-format>"
              local, domain = value.split("@", 1)
              if len(local) <= 3:
                  visible = local[:1] + "*" * max(0, len(local) - 1)
              else:
                  visible = local[:2] + "*" * (len(local) - 4) + local[-2:]
              return f"{visible}@{domain.lower()}"

          email_a = os.environ.get("SUPABASE_TEST_USER_A_EMAIL", "")
          email_b = os.environ.get("SUPABASE_TEST_USER_B_EMAIL", "")
          password_a = os.environ.get("SUPABASE_TEST_USER_A_PASSWORD", "")
          password_b = os.environ.get("SUPABASE_TEST_USER_B_PASSWORD", "")

          print("LIVE_AUTH_SECRET_DIAGNOSTICS_BEGIN")
          print("A_EMAIL_MASKED=" + mask_email(email_a))
          print("B_EMAIL_MASKED=" + mask_email(email_b))
          print("EMAILS_DISTINCT_CASE_INSENSITIVE=" + str(email_a.strip().casefold() != email_b.strip().casefold()))
          for label, password in (("A", password_a), ("B", password_b)):
              print(f"{label}_PASSWORD_LENGTH={len(password)}")
              print(f"{label}_PASSWORD_HAS_EDGE_WHITESPACE={password != password.strip()}")
              print(f"{label}_PASSWORD_HAS_CR_OR_LF={chr(10) in password or chr(13) in password}")
              print(f"{label}_PASSWORD_HAS_TAB={chr(9) in password}")
          print("PASSWORD_SECRETS_DISTINCT=" + str(password_a != password_b))
          print("LIVE_AUTH_SECRET_DIAGNOSTICS_END")
          PY

      - name: Run real Auth signup smoke test
        if: ${{ inputs.phase == 'signup' }}
        run: PYTHONPATH=. python scripts/test_supabase_auth_signup_live.py

      - name: Run real Auth sign-in/refresh and PostgREST two-owner isolation
        if: ${{ github.event_name == 'push' || inputs.phase == 'auth-postgrest' }}
        run: PYTHONPATH=. python scripts/test_supabase_auth_postgrest_live.py
