name: Authorized test-project Auth recovery request (one-shot)

on:
  push:
    branches:
      - "ci/supabase-auth-live-acceptance-dispatch"
    paths:
      - ".ci-triggers/test-auth-recovery-2026-11-08"

permissions:
  contents: read

jobs:
  request-test-recovery:
    name: Send recovery links to the two allowlisted test accounts
    if: false # one-shot recovery dispatch completed; prevent accidental repeats
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: https://pidcepvwsezdrlhxqksg.supabase.co
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_TEST_USER_A_EMAIL: ${{ secrets.SUPABASE_TEST_USER_A_EMAIL }}
      SUPABASE_TEST_USER_B_EMAIL: ${{ secrets.SUPABASE_TEST_USER_B_EMAIL }}

    steps:
      - name: Checkout the isolated QA branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate test-only inputs without printing secrets
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import os

          expected_url = "https://pidcepvwsezdrlhxqksg.supabase.co"
          if os.environ.get("SUPABASE_URL", "").rstrip("/") != expected_url:
              raise SystemExit("RECOVERY_TARGET=BLOCKED; test project URL mismatch")

          required = (
              "SUPABASE_PUBLISHABLE_KEY",
              "SUPABASE_TEST_USER_A_EMAIL",
              "SUPABASE_TEST_USER_B_EMAIL",
          )
          missing = [name for name in required if not os.environ.get(name, "").strip()]
          if missing:
              raise SystemExit("RECOVERY_CONFIG=BLOCKED; missing required test secret names: " + ", ".join(missing))

          expected_key = "4466db377d54ad52d16b78002fa97e0cadfff82cd3691b143ecd93ffb0377b32"
          actual_key = hashlib.sha256(os.environ["SUPABASE_PUBLISHABLE_KEY"].encode("utf-8")).hexdigest()
          if actual_key != expected_key:
              raise SystemExit("RECOVERY_CONFIG=BLOCKED; publishable key is not the pinned test-project key")

          expected_emails = {
              "SUPABASE_TEST_USER_A_EMAIL": "f6cfaac879514b2d2f5ace8c2fe076d14c08639d669d40eb2f8cf3af87273d31",
              "SUPABASE_TEST_USER_B_EMAIL": "6c53ece92c5e1dcbe3785e183b66ee39f96e61f9b10ff8b4ee497baa54ae3e68",
          }
          for name, expected in expected_emails.items():
              value = os.environ[name].strip().casefold()
              actual = hashlib.sha256(value.encode("utf-8")).hexdigest()
              if actual != expected:
                  raise SystemExit("RECOVERY_CONFIG=BLOCKED; allowlisted test identity mismatch")
          if os.environ["SUPABASE_TEST_USER_A_EMAIL"].strip().casefold() == os.environ["SUPABASE_TEST_USER_B_EMAIL"].strip().casefold():
              raise SystemExit("RECOVERY_CONFIG=BLOCKED; test email identities are not distinct")

          print("RECOVERY_TARGET=PASS; dedicated test project only")
          print("RECOVERY_KEY=PASS; pinned test publishable key")
          print("RECOVERY_IDENTITIES=PASS; both allowlisted test users")
          PY

      - name: Install minimal HTTP dependency
        run: python -m pip install "requests>=2.31,<3"

      - name: Request recovery emails for test accounts A and B
        run: PYTHONPATH=. python scripts/request_test_supabase_auth_recovery.py
