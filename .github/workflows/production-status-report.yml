name: AI Council Production Status Report

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ai-council-production-status-report
  cancel-in-progress: false

jobs:
  report:
    name: Read-only production and workflow status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_API_URL: ${{ github.api_url }}
      PRODUCTION_BRANCH: gitops-v0.4-final
      REPORT_OUTPUT: dist/AI_COUNCIL_PRODUCTION_STATUS_REPORT.json
    steps:
      - name: Checkout report code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Collect branch, exact-commit CI, recent failures, and closure metadata
        run: python scripts/production_status_report.py

      - name: Upload JSON status report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AI_COUNCIL_PRODUCTION_STATUS_REPORT-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/AI_COUNCIL_PRODUCTION_STATUS_REPORT.json
          if-no-files-found: error
          compression-level: 6
          retention-days: 90
