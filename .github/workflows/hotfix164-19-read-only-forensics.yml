name: HISTORICAL HOTFIX164.19 Manifest and Fail-Closed Compatibility Audit (Manual Only)

on:
  # Select the historical HOTFIX164.19 ref when running this legacy contract.
  # This workflow must not gate current HOTFIX164.25 pushes.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hotfix164-19-read-only-forensics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regression:
    name: Full regression, production core, and ZIP round-trip
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Validate sources, run full regression, build ZIP, and retest extracted ZIP
        run: |
          python build_release.py --output HOTFIX164.25_HISTORICAL_HOTFIX16419_COMPATIBILITY_AUDIT.zip

      - name: Verify frozen identity, retained historical contract, and current runtime separation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import providers
          expected = 'V22.1-HOTFIX123.2-SINGLE-REQUEST-DETERMINISM-LIVE-CASCADE'
          if Path('VERSION.txt').read_text(encoding='utf-8').strip() != expected:
              raise SystemExit('VERSION_CONTRACT_FAILED')
          manifest = json.loads(Path('HOTFIX164.19_RELEASE_MANIFEST.json').read_text(encoding='utf-8'))
          if manifest.get('release') != 'HOTFIX164.19' or manifest.get('provider_core_identity') != expected:
              raise SystemExit('HOTFIX164.19_MANIFEST_IDENTITY_FAILED')
          if providers.CURRENT_HOTFIX_RELEASE_VERSION.startswith('HOTFIX164.19 '):
              raise SystemExit('HISTORICAL_RELEASE_MUST_NOT_BE_ACTIVE')
          guards = manifest.get('guardrails', {})
          if guards.get('version_txt_contract_preserved') is not True:
              raise SystemExit('FROZEN_VERSION_GUARD_FAILED')
          if guards.get('failed_platform_audit_can_be_overridden_by_consistent_counts') is not False:
              raise SystemExit('FAIL_CLOSED_CLOSURE_GUARD_FAILED')
          print('VERSION_CONTRACT=PASS')
          print('HISTORICAL_HOTFIX16419_MANIFEST=PASS')
          print('CURRENT_RUNTIME_NOT_MISLABELED_AS_HOTFIX16419=PASS')
          print('FAIL_CLOSED_CLOSURE_GUARD=PASS')
          PY

      - name: Upload candidate ZIP and validation metadata (never publish automatically)
        if: ${{ success() && hashFiles('HOTFIX164.25_HISTORICAL_HOTFIX16419_COMPATIBILITY_AUDIT.zip') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: HOTFIX164.25-historical-HOTFIX16419-compatibility-audit
          path: |
            HOTFIX164.25_HISTORICAL_HOTFIX16419_COMPATIBILITY_AUDIT.zip
            HOTFIX164.25_HISTORICAL_HOTFIX16419_COMPATIBILITY_AUDIT.zip.sha256
            RELEASE_MANIFEST.json
            HOTFIX164.19_RELEASE_MANIFEST.json
            HOTFIX164.19_RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 14
