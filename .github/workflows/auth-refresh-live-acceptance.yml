name: Supabase Auth refresh-token live acceptance

on:
  pull_request:
    branches:
      - gitops-v0.4-final
    paths:
      - "supabase_auth.py"
      - "scripts/test_auth_refresh_live.py"
      - ".github/workflows/auth-refresh-live-acceptance.yml"

permissions:
  contents: read

concurrency:
  group: auth-refresh-live-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  live-auth-refresh:
    name: Live Auth refresh / two-account session renewal
    if: >-
      github.repository == 'Mamoussa1966/free-chat-app' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'Mamoussa1966'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: https://pidcepvwsezdrlhxqksg.supabase.co
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_TEST_USER_A_EMAIL: ${{ secrets.SUPABASE_TEST_USER_A_EMAIL }}
      SUPABASE_TEST_USER_A_PASSWORD: ${{ secrets.SUPABASE_TEST_USER_A_PASSWORD }}
      SUPABASE_TEST_USER_B_EMAIL: ${{ secrets.SUPABASE_TEST_USER_B_EMAIL }}
      SUPABASE_TEST_USER_B_PASSWORD: ${{ secrets.SUPABASE_TEST_USER_B_PASSWORD }}

    steps:
      - name: Checkout source without persisting credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate required configuration without printing values
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          names = (
              "SUPABASE_URL",
              "SUPABASE_PUBLISHABLE_KEY",
              "SUPABASE_TEST_USER_A_EMAIL",
              "SUPABASE_TEST_USER_A_PASSWORD",
              "SUPABASE_TEST_USER_B_EMAIL",
              "SUPABASE_TEST_USER_B_PASSWORD",
          )
          missing = [name for name in names if not os.environ.get(name, "").strip()]
          if missing:
              print("LIVE_AUTH_REFRESH_CONFIG=BLOCKED; missing names: " + ", ".join(missing))
              raise SystemExit(2)
          if os.environ["SUPABASE_URL"] != "https://pidcepvwsezdrlhxqksg.supabase.co":
              raise SystemExit("LIVE_AUTH_REFRESH_CONFIG=FAIL; test project URL mismatch")
          print("LIVE_AUTH_REFRESH_CONFIG=PASS; test target pinned; values hidden")
          PY

      - name: Install existing minimal HTTP dependency
        run: python -m pip install "requests>=2.31,<3"

      - name: Exercise live Auth refresh and rotated-token chain
        run: PYTHONPATH=. python scripts/test_auth_refresh_live.py
