name: HOTFIX164.18 Request-Scoped Bridge Proof Diagnostics

on:
  push:
    branches:
      - gitops-v0.4-final
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hotfix164-18-proof-diagnostics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regression:
    name: Full regression, production core, and ZIP round-trip
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Validate sources, run full regression, build ZIP, and retest extracted ZIP
        run: |
          python build_release.py --output HOTFIX164.18_REQUEST_SCOPED_BRIDGE_PROOF_DIAGNOSTICS.zip

      - name: Verify frozen provider identity and release scope
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import providers
          expected = "V22.1-HOTFIX123.2-SINGLE-REQUEST-DETERMINISM-LIVE-CASCADE"
          if Path("VERSION.txt").read_text(encoding="utf-8").strip() != expected:
              raise SystemExit("VERSION_CONTRACT_FAILED")
          manifest = json.loads(Path("HOTFIX164.18_RELEASE_MANIFEST.json").read_text(encoding="utf-8"))
          if manifest.get("release") != "HOTFIX164.18" or manifest.get("provider_core_identity") != expected:
              raise SystemExit("HOTFIX164.18_MANIFEST_IDENTITY_FAILED")
          if not providers.CURRENT_HOTFIX_RELEASE_VERSION.startswith("HOTFIX164.18 "):
              raise SystemExit("HOTFIX164.18_RUNTIME_LABEL_FAILED")
          guards = manifest.get("guardrails", {})
          if guards.get("v26_3_identity_logic_changed") is not False or guards.get("canonical_counter_logic_changed") is not False:
              raise SystemExit("CANONICAL_SCOPE_GUARD_FAILED")
          print("VERSION_CONTRACT=PASS")
          print("HOTFIX164.18_SCOPE_GUARDS=PASS")
          PY

      - name: Upload generated ZIP and SHA-256
        if: ${{ success() && hashFiles('HOTFIX164.18_REQUEST_SCOPED_BRIDGE_PROOF_DIAGNOSTICS.zip') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: HOTFIX164.18-request-scoped-bridge-proof-diagnostics
          path: |
            HOTFIX164.18_REQUEST_SCOPED_BRIDGE_PROOF_DIAGNOSTICS.zip
            HOTFIX164.18_REQUEST_SCOPED_BRIDGE_PROOF_DIAGNOSTICS.zip.sha256
            RELEASE_MANIFEST.json
            HOTFIX164.18_RELEASE_MANIFEST.json
            HOTFIX164.18_RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 14
