name: Production Supabase backup and isolated restore

on:
  push:
    branches:
      - qa/live-backup-restore-acceptance
    paths:
      - ".github/workflows/production-supabase-backup.yml"

permissions:
  contents: read

jobs:
  backup-and-restore:
    name: Full database export, isolated restore, checksums
    if: >-
      github.repository == 'Mamoussa1966/free-chat-app' &&
      github.actor == 'Mamoussa1966' &&
      github.ref == 'refs/heads/qa/live-backup-restore-acceptance'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify production connection secret is present and pinned
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re
          import shlex
          from urllib.parse import urlsplit, unquote
          raw = os.environ.get("SUPABASE_PROD_DB_URL", "").strip()
          if not raw:
              raise SystemExit("BACKUP_CONFIG=FAIL; SUPABASE_PROD_DB_URL is missing")
          value = raw.strip("'\" ")
          project = "wzhsilufajemyqtednie"
          host = user = database = ""
          parsed = urlsplit(value)
          if parsed.scheme.lower() in ("postgres", "postgresql"):
              host = (parsed.hostname or "").lower()
              user = unquote(parsed.username or "")
              database = parsed.path.lstrip("/")
          else:
              # Accept libpq keyword/value connection strings (host=... user=... dbname=...).
              # Also accept a psql command that contains one PostgreSQL URI.
              match = re.search(r"postgres(?:ql)?://[^\\s'\"]+", value, flags=re.IGNORECASE)
              if match:
                  parsed = urlsplit(match.group(0))
                  host = (parsed.hostname or "").lower()
                  user = unquote(parsed.username or "")
                  database = parsed.path.lstrip("/")
              else:
                  try:
                      tokens = shlex.split(value)
                  except ValueError:
                      tokens = []
                  kv = {}
                  for token in tokens:
                      if "=" in token:
                          key, val = token.split("=", 1)
                          kv[key.lower()] = val
                  host = kv.get("host", "").lower()
                  user = kv.get("user", "")
                  database = kv.get("dbname", kv.get("database", ""))
                  if not host and tokens:
                      # Support a psql CLI command using -h/-U/-d without logging arguments.
                      for index, token in enumerate(tokens[:-1]):
                          if token in ("-h", "--host"):
                              host = tokens[index + 1].lower()
                          elif token in ("-U", "--username"):
                              user = tokens[index + 1]
                          elif token in ("-d", "--dbname"):
                              database = tokens[index + 1]
          direct_host_ok = host == f"db.{project}.supabase.co"
          pooler_host_ok = host.endswith(".pooler.supabase.com")
          pooler_user_ok = user == f"postgres.{project}"
          database_ok = database in ("postgres", "")
          project_ok = direct_host_ok or (pooler_host_ok and pooler_user_ok)
          if not (project_ok and database_ok):
              user_shape = (
                  "postgres.<expected-project>" if pooler_user_ok else
                  "postgres" if user == "postgres" else
                  "other-or-unparsed"
              )
              print(
                  "BACKUP_CONFIG_DIAGNOSTIC "
                  f"host={host or 'unparsed'} user_shape={user_shape} "
                  f"database={database or 'unparsed'} direct_host_ok={direct_host_ok} "
                  f"pooler_host_ok={pooler_host_ok} database_ok={database_ok}"
              )
              raise SystemExit("BACKUP_CONFIG=FAIL; connection format does not identify the pinned production project")
          print("BACKUP_CONFIG=PASS; production project pin verified; secret value hidden")
          PY

      - name: Prepare isolated Supabase PostgreSQL 17
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zip unzip
          python -m pip install --disable-pip-version-check "cryptography==50.0.2"
          npm install --global supabase
          sed -i 's/major_version = 15/major_version = 17/' supabase/config.toml
          supabase start -x studio,imgproxy,mailpit,edge-runtime,analytics,vector
          supabase status -o env > /tmp/local-supabase.env
          grep -q 'DB_URL=' /tmp/local-supabase.env

      - name: Full database export and isolated restore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backup-work transfer
          cat > backup-work/run_dump_restore.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          SOURCE="$SUPABASE_PROD_DB_URL"
          LOCAL_ADMIN="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          LOCAL_RESTORE="postgresql://postgres:postgres@127.0.0.1:54322/restore_validation"

          # Full logical dump: all database schemas, table data and large objects.
          # The source connection is used only by pg_dump / read-only catalog queries.
          pg_dump --no-owner --no-acl --format=custom --blobs \
            --file=/backup/database.dump "$SOURCE"

          # Preserve global role definitions and memberships without exporting password hashes.
          pg_dumpall --roles-only --no-role-passwords --dbname="$SOURCE" > /backup/roles.sql

          # Inventory every non-system schema, active extension, RLS policy and table row count.
          psql "$SOURCE" -X -v ON_ERROR_STOP=1 -At \
            -c "SELECT nspname FROM pg_namespace WHERE nspname NOT IN ('pg_catalog','information_schema') AND nspname NOT LIKE 'pg_toast%' ORDER BY 1" \
            > /backup/source_schemas.txt
          psql "$SOURCE" -X -v ON_ERROR_STOP=1 -At -F "|" \
            -c "SELECT e.extname,e.extversion,COALESCE(n.nspname,'') FROM pg_extension e LEFT JOIN pg_namespace n ON n.oid=e.extnamespace ORDER BY 1" \
            > /backup/source_extensions.tsv
          psql "$SOURCE" -X -v ON_ERROR_STOP=1 -At -F "|" \
            -c "SELECT schemaname,tablename,policyname,roles::text,cmd,COALESCE(qual,''),COALESCE(with_check,'') FROM pg_policies ORDER BY 1,2,3" \
            > /backup/source_policies.tsv
          psql "$SOURCE" -X -v ON_ERROR_STOP=1 -At -F "|" \
            -c "SELECT schemaname,tablename FROM pg_tables WHERE schemaname NOT IN ('pg_catalog','information_schema') AND schemaname NOT LIKE 'pg_toast%' ORDER BY 1,2" \
            > /backup/source_tables.list

          : > /backup/source_rows.tsv
          while IFS="|" read -r schema table; do
            count=$(psql "$SOURCE" -X -v ON_ERROR_STOP=1 -At \
              -v schema="$schema" -v table="$table" \
              -c 'SELECT count(*) FROM :"schema".:"table";')
            printf "%s.%s\t%s\n" "$schema" "$table" "$count" >> /backup/source_rows.tsv
          done < /backup/source_tables.list

          psql "$SOURCE" -X -v ON_ERROR_STOP=1 -At -F "|" \
            -c "SELECT (SELECT count(*) FROM auth.users), (SELECT count(*) FROM storage.buckets), (SELECT count(*) FROM storage.objects), (SELECT count(*) FROM public.council_conversations), (SELECT count(*) FROM pg_largeobject_metadata)" \
            > /backup/source_key_counts.tsv
          psql "$SOURCE" -X -v ON_ERROR_STOP=1 -At \
            -c "SELECT current_setting('server_version')" > /backup/source_server_version.txt

          # Create an empty, distinct restore database inside local Supabase Postgres.
          psql "$LOCAL_ADMIN" -X -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE restore_validation TEMPLATE template0"

          # Ensure roles referenced by RLS policies exist in the isolated restore cluster.
          psql "$SOURCE" -X -v ON_ERROR_STOP=1 -At \
            -c "SELECT DISTINCT unnest(roles)::text FROM pg_policies ORDER BY 1" \
            > /backup/policy_roles.list
          while IFS= read -r role; do
            [ -n "$role" ] || continue
            case "$role" in
              *[!a-zA-Z0-9_]*)
                echo "Unsupported role identifier in policy; refusing restore"
                exit 20
                ;;
            esac
            exists=$(psql "$LOCAL_ADMIN" -X -At -c "SELECT 1 FROM pg_roles WHERE rolname = '$role'")
            if [ "$exists" != "1" ]; then
              psql "$LOCAL_ADMIN" -X -v ON_ERROR_STOP=1 -c "CREATE ROLE \"$role\" NOLOGIN"
            fi
          done < /backup/policy_roles.list

          # Actual restore, not an archive-list-only check.
          pg_restore --exit-on-error --no-owner --no-acl \
            --dbname="$LOCAL_RESTORE" /backup/database.dump

          # Compare schemas, extension versions, exact RLS policy definitions and all table row counts.
          psql "$LOCAL_RESTORE" -X -v ON_ERROR_STOP=1 -At \
            -c "SELECT nspname FROM pg_namespace WHERE nspname NOT IN ('pg_catalog','information_schema') AND nspname NOT LIKE 'pg_toast%' ORDER BY 1" \
            > /backup/restored_schemas.txt
          psql "$LOCAL_RESTORE" -X -v ON_ERROR_STOP=1 -At -F "|" \
            -c "SELECT e.extname,e.extversion,COALESCE(n.nspname,'') FROM pg_extension e LEFT JOIN pg_namespace n ON n.oid=e.extnamespace ORDER BY 1" \
            > /backup/restored_extensions.tsv
          psql "$LOCAL_RESTORE" -X -v ON_ERROR_STOP=1 -At -F "|" \
            -c "SELECT schemaname,tablename,policyname,roles::text,cmd,COALESCE(qual,''),COALESCE(with_check,'') FROM pg_policies ORDER BY 1,2,3" \
            > /backup/restored_policies.tsv
          : > /backup/restored_rows.tsv
          while IFS="|" read -r schema table; do
            count=$(psql "$LOCAL_RESTORE" -X -v ON_ERROR_STOP=1 -At \
              -v schema="$schema" -v table="$table" \
              -c 'SELECT count(*) FROM :"schema".:"table";')
            printf "%s.%s\t%s\n" "$schema" "$table" "$count" >> /backup/restored_rows.tsv
          done < /backup/source_tables.list

          psql "$LOCAL_RESTORE" -X -v ON_ERROR_STOP=1 -At -F "|" \
            -c "SELECT (SELECT count(*) FROM auth.users), (SELECT count(*) FROM storage.buckets), (SELECT count(*) FROM storage.objects), (SELECT count(*) FROM public.council_conversations), (SELECT count(*) FROM pg_largeobject_metadata)" \
            > /backup/restored_key_counts.tsv

          diff -u /backup/source_schemas.txt /backup/restored_schemas.txt
          diff -u /backup/source_extensions.tsv /backup/restored_extensions.tsv
          diff -u /backup/source_policies.tsv /backup/restored_policies.tsv
          diff -u /backup/source_rows.tsv /backup/restored_rows.tsv
          diff -u /backup/source_key_counts.tsv /backup/restored_key_counts.tsv
          pg_restore --list /backup/database.dump > /backup/archive_toc.txt
          test -s /backup/archive_toc.txt
          test -s /backup/roles.sql
          echo "FULL_DATABASE_EXPORT=PASS"
          echo "ISOLATED_DATABASE_RESTORE=PASS"
          echo "SCHEMA_EXTENSION_POLICY_AND_ROWCOUNT_MATCH=PASS"
          SCRIPT
          chmod 700 backup-work/run_dump_restore.sh

          docker run --rm --network host \
            -e SUPABASE_PROD_DB_URL \
            -v "$PWD/backup-work:/backup" \
            postgres:17-bookworm bash /backup/run_dump_restore.sh

      - name: Document coverage and create SHA-256 ZIP
        shell: bash
        run: |
          set -euo pipefail
          cat > backup-work/README-RESTORE-REPORT.md <<'EOF'
          # Supabase production database backup and isolated restore report

          - Source project: `wzhsilufajemyqtednie`
          - PostgreSQL server version: recorded in `source_server_version.txt`.
          - Export method: PostgreSQL 17 `pg_dump` custom archive with large objects.
          - Global roles: exported separately using `pg_dumpall --roles-only --no-role-passwords`; role passwords are deliberately excluded.
          - Database schemas: all non-system schemas from the source catalog, including `public`, `auth`, `storage`, `realtime`, `extensions`, `supabase_migrations`, and `vault` where present.
          - Database content: table data, DDL, indexes, functions, triggers, RLS policies, installed extensions and large objects.
          - Auth: raw database archive includes `auth.users` and related Auth tables. Password hashes and Auth-related data are sensitive and require private storage.
          - Storage: bucket/object metadata is included through the database archive. PostgreSQL dumps do not contain the external binary payloads served by the Storage API; the source object count is recorded. A zero count means no Storage API objects were listed in `storage.objects` at export time.
          - Vault: encrypted database values, if present, remain encrypted. Project-level JWT secrets, API keys, Edge Function secrets and dashboard settings are outside the database dump.
          - Restore target: newly created `restore_validation` database in a separate local Supabase PostgreSQL 17 Docker stack. No production DDL or data writes are performed.
          - Acceptance: restore must succeed and exact schema inventory, extension versions, RLS policy definitions, every table row count, Auth/Storage/conversation counts and large-object counts must match.
          EOF

          cat > backup-work/RESTORE-VALIDATION.txt <<EOF
          FULL_DATABASE_EXPORT=PASS
          ISOLATED_DATABASE_RESTORE=PASS
          SCHEMA_EXTENSION_POLICY_AND_ROWCOUNT_MATCH=PASS
          VALIDATED_AT_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          SOURCE_PROJECT=wzhsilufajemyqtednie
          POSTGRES_SERVER_VERSION=$(cat backup-work/source_server_version.txt)
          AUTH_USERS|STORAGE_BUCKETS|STORAGE_OBJECTS|COUNCIL_CONVERSATIONS|LARGE_OBJECTS
          $(cat backup-work/source_key_counts.tsv)
          EOF

          sha256sum backup-work/database.dump backup-work/roles.sql \
            backup-work/source_schemas.txt backup-work/source_extensions.tsv \
            backup-work/source_policies.tsv backup-work/source_rows.tsv \
            backup-work/source_key_counts.tsv backup-work/source_server_version.txt \
            backup-work/README-RESTORE-REPORT.md backup-work/RESTORE-VALIDATION.txt \
            > backup-work/SHA256SUMS
          mkdir -p package
          cp backup-work/{database.dump,roles.sql,source_schemas.txt,source_extensions.tsv,source_policies.tsv,source_rows.tsv,source_key_counts.tsv,source_server_version.txt,README-RESTORE-REPORT.md,RESTORE-VALIDATION.txt,SHA256SUMS} package/
          (cd package && zip -q -9 -r ../supabase-db-dump-2026-11-08.zip .)
          unzip -t supabase-db-dump-2026-11-08.zip
          sha256sum supabase-db-dump-2026-11-08.zip > package-sha256.txt
          echo "BACKUP_ZIP_SHA256=$(cut -d ' ' -f1 package-sha256.txt)" >> "$GITHUB_ENV"
          echo "BACKUP_ZIP_SIZE=$(stat -c '%s' supabase-db-dump-2026-11-08.zip)" >> "$GITHUB_ENV"

      - name: Encrypt the ZIP for private off-site transfer
        shell: bash
        run: |
          set -euo pipefail
          cat > backup-work/backup-recipient.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEA0dhf+eOP4iJO+uCVC/e6
          6aMwU5LGuU5px5gYKr5/dyEkZj+meL21XZHymn8Z6VkeKokzier91wmhhI6BgCO5
          O2yuKd5bI/r1Ez2hg13Jl2PMhpyHJL7KxI/1tK6Qg2TOD0qg6mMVOsUmerpd0mAV
          4NiK/BKC+cQOOPIUVgR0Plb9aZUhRtQoyECi2mQ0H7FFc8EqwOAfjp7QAkpMDO8M
          o02MiEbjL7dh7eDbo3qUnWzarah8xLB+cU5qaxSzdqSvyZth4p8fwSOBKLCaafyq
          Xpjd2k0w+HpMTBXM4cXgRzXJkUaAydcqiLonvup5OayyseSE4388HnL3d8TZ4OiW
          zILaB4Um5u4U0uJDqtAHMPtVoo9vsVVVxPgS9BYiYPjI43Rgd0fVpcwHEjMWPv5k
          dYYfM9yqmiLOBZdPzuQ6iimujKEUEcAddw4Oai5ZWFWauKhh97w3Sk7ONCQN4Pfr
          Vs5ti/bMrlQdEIv2bxgVkdyBcrU2BdHs8zF9CGPSivxDKRizexDcDfMyK21CXUeX
          rQVq4q+cZWsLQjZaAtCtewJM2X/yqyiTeAKfIQpV3Nhs9YZFof1AV/nzu2ZeuzMK
          QMOYaGgoip34Fzm/NSHvZ+vcSbeV67BxNc0nOCJwX9k/dDvEIh+mlaFsuzh/wThq
          61mZw3PowhxNipGoFcrrAtkCAwEAAQ==
          -----END PUBLIC KEY-----
          PEM
          python - <<'PY'
          from pathlib import Path
          import secrets
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          payload = Path("supabase-db-dump-2026-11-08.zip").read_bytes()
          public = serialization.load_pem_public_key(Path("backup-work/backup-recipient.pem").read_bytes())
          key = secrets.token_bytes(32)
          nonce = secrets.token_bytes(12)
          aad = b"AI-Council-Supabase-Backup-v1"
          ciphertext = AESGCM(key).encrypt(nonce, payload, aad)
          wrapped_key = public.encrypt(
              key,
              padding.OAEP(
                  mgf=padding.MGF1(algorithm=hashes.SHA256()),
                  algorithm=hashes.SHA256(),
                  label=aad,
              ),
          )
          Path("transfer/supabase-db-dump-2026-11-08.zip.enc").write_bytes(nonce + ciphertext)
          Path("transfer/backup-key.enc").write_bytes(wrapped_key)
          PY
          cp package-sha256.txt transfer/
          (cd transfer && sha256sum supabase-db-dump-2026-11-08.zip.enc backup-key.enc > transfer-sha256.txt)
          rm -rf backup-work package supabase-db-dump-2026-11-08.zip
          test -s transfer/supabase-db-dump-2026-11-08.zip.enc
          test -s transfer/backup-key.enc
          echo "PLAINTEXT_BACKUP_REMOVED=PASS"
          echo "BACKUP_ZIP_SHA256=$BACKUP_ZIP_SHA256"
          echo "BACKUP_ZIP_SIZE=$BACKUP_ZIP_SIZE"

      - name: Upload encrypted one-day transfer artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: supabase-prod-backup-2026-11-08-encrypted
          path: transfer/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
