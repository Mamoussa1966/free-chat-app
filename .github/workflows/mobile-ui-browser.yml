name: Mobile UI acceptance browser smoke

on:
  pull_request:
    branches:
      - gitops-v0.4-final
    paths:
      - "main.py"
      - "conversation_runtime.py"
      - "conversation_store.py"
      - "conversation_persistence_v26.py"
      - "supabase_conversation_repository.py"
      - "tests/browser/test_mobile_acceptance.py"
      - ".github/workflows/mobile-ui-browser.yml"
  push:
    branches:
      - gitops-v0.4-final
    paths:
      - "main.py"
      - "conversation_runtime.py"
      - "conversation_store.py"
      - "conversation_persistence_v26.py"
      - "supabase_conversation_repository.py"
      - "tests/browser/test_mobile_acceptance.py"
      - ".github/workflows/mobile-ui-browser.yml"

permissions:
  contents: read

concurrency:
  group: mobile-ui-acceptance
  cancel-in-progress: true

jobs:
  mobile-ui:
    name: Browser / real Council phone viewport
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install local app and Playwright dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "playwright==1.64.1"
          python -m playwright install --with-deps chromium

      - name: Run real app phone-viewport acceptance
        run: |
          pytest -q tests/browser/test_mobile_acceptance.py

      - name: Upload mobile failure screenshot
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mobile-ui-acceptance-failure
          path: artifacts/mobile-acceptance/
          if-no-files-found: ignore
          retention-days: 7
