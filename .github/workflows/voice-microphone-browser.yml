name: Voice virtual-microphone browser smoke

on:
  pull_request:
    branches:
      - gitops-v0.4-final
    paths:
      - "main.py"
      - "requirements.txt"
      - "tests/browser/**"
      - ".github/workflows/voice-microphone-browser.yml"
  push:
    branches:
      - gitops-v0.4-final
    paths:
      - "main.py"
      - "requirements.txt"
      - "tests/browser/**"
      - ".github/workflows/voice-microphone-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voice-browser-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  virtual-microphone:
    name: Browser / virtual microphone and audio preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install app and browser-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "playwright==1.64.1"
          python -m playwright install --with-deps chromium

      - name: Run the isolated virtual-microphone test
        run: |
          pytest -q tests/browser/test_virtual_microphone.py

      - name: Upload browser screenshot if the test fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: voice-browser-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/voice-browser/
          if-no-files-found: ignore
          retention-days: 7
